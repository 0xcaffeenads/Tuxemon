name: Build & Publish Web Version (pygbag)

on:
  push:
    branches: [main, development]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

jobs:
  build-web:
    name: Build for Emscripten (pygbag) runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pygbag
        run: python -m pip install --upgrade pygbag

      # Only the code + assets the game actually needs at runtime are
      # copied into a staging folder. This keeps docs/, tests/,
      # buildconfig/ and other native-only packaging scripts out of the
      # web bundle so the download stays as small as possible.
      - name: Stage web build folder
        run: |
          mkdir -p webbuild
          cp -r tuxemon webbuild/tuxemon
          cp -r mods webbuild/mods
          cp main.py webbuild/main.py
          cp run_tuxemon.py webbuild/run_tuxemon.py
          cp requirements.txt webbuild/requirements.txt
          cp LICENSE webbuild/LICENSE

      - name: Build with pygbag
        run: python -m pygbag --build webbuild/main.py

      - name: Upload build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuxemon-web-build
          path: webbuild/build/web
          if-no-files-found: error

      # Publishes the build to the gh-pages branch. After the first
      # successful run, enable GitHub Pages in the repo settings
      # ("Settings" -> "Pages" -> Source: "Deploy from a branch" ->
      # branch "gh-pages") to get a live URL at
      # https://<username>.github.io/<repo-name>/
      - name: Deploy to GitHub Pages branch
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: webbuild/build/web
